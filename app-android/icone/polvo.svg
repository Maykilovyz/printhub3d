<!-- Ícone do PrintHub 3D: polvo minimalista no degradê azul (cliente) → roxo (Oficina).
     Área de 108x108, como o Android usa nos ícones adaptáveis; o desenho fica no centro. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3550D6"/><stop offset="1" stop-color="#7A3FD1"/></linearGradient></defs>
  <rect id="fundo" width="108" height="108" fill="url(#g)"/>
  <g id="polvo">
    <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"><path d="M41 58c-3 8-7 13-3 19"/><path d="M50 61c-1 7-3 12 0 18"/><path d="M58 61c1 7 3 12 0 18"/><path d="M67 58c3 8 7 13 3 19"/></g>
    <path d="M34 50a20 20 0 0 1 40 0v6c0 4-4 6-8 6H42c-4 0-8-2-8-6z" fill="#fff"/>
    <circle cx="47" cy="49" r="3.2" fill="#4A3FD3"/><circle cx="61" cy="49" r="3.2" fill="#4A3FD3"/>
  </g>
</svg>
