<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novo pedido · PrintHub 3D</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono&display=swap">
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <header class="topo"><div class="topo-dentro">
    <a class="marca" href="/painel.html">PrintHub 3D</a>
    <nav class="perfil">
      <img id="foto-usuario" class="foto" alt="" hidden referrerpolicy="no-referrer">
      <span><span id="nome-usuario"></span> <span class="papel" id="papel-usuario"></span></span>
      <button class="botao pequeno" id="sair">Sair</button>
    </nav>
  </div></header>

  <main class="pagina">
    <a class="botao pequeno voltar" href="/painel.html" aria-label="Voltar" title="Voltar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <h1>Novo pedido</h1>

    <form class="cartao" id="form">
      <!-- Bloco 1: o que é -->
      <div class="secao-form">
        <h2>A peça</h2>
        <div class="categorias" id="categorias" role="radiogroup" aria-label="Categoria"></div>
        <div class="campo"><label for="titulo">Título</label>
          <input id="titulo" name="titulo" required placeholder="Ex.: Maquete de prédio, escala 1:200"></div>
        <div class="campo"><label for="descricao">Descrição</label>
          <textarea id="descricao" name="descricao" required placeholder="Para que vai usar e o nível de detalhe."></textarea></div>
      </div>

      <!-- Bloco 2: detalhes (tudo opcional, o fabricante orienta) -->
      <div class="secao-form">
        <h2>Detalhes <span class="apagado" style="font:400 14px var(--corpo)">opcional</span></h2>
        <div class="grade">
          <!-- Medidas: cada caixa com o nome em cima, para ninguém confundir largura, profundidade e altura -->
          <div class="campo medidas"><span class="lbl">Medidas <span class="apagado" style="font-weight:400">em milímetros (1 cm = 10 mm)</span></span>
            <div class="dimensoes">
              <div class="campo"><label for="largura">Largura</label>
                <input id="largura" name="largura_mm" type="number" min="1" inputmode="numeric" placeholder="mm" class="mono"></div>
              <div class="campo"><label for="profundidade">Profundidade</label>
                <input id="profundidade" name="profundidade_mm" type="number" min="1" inputmode="numeric" placeholder="mm" class="mono"></div>
              <div class="campo"><label for="altura">Altura</label>
                <input id="altura" name="altura_mm" type="number" min="1" inputmode="numeric" placeholder="mm" class="mono"></div>
            </div>
          </div>
          <div class="campo"><label for="quantidade">Quantidade</label><input id="quantidade" name="quantidade" type="number" min="1" value="1" class="mono"></div>
          <div class="campo"><label for="prazo">Preciso até</label><input id="prazo" name="prazo" type="date"></div>
        </div>
        <div class="campo"><span class="lbl">Material</span>
          <div class="opcoes" id="materiais"></div>
          <span class="dica" id="dica-material"></span>
        </div>
        <div class="campo"><span class="lbl">Cor</span>
          <div class="opcoes" id="cores"></div>
        </div>
      </div>

      <!-- Bloco 3: referências -->
      <div class="secao-form">
        <h2>Arquivos <span class="apagado" style="font:400 14px var(--corpo)">opcional</span></h2>
        <div class="campo">
          <input id="anexos" name="anexos" type="file" multiple accept=".stl,.obj,.3mf,.jpg,.jpeg,.png,.webp,.pdf" aria-label="Imagens ou arquivo 3D">
          <span class="dica">Fotos, croquis ou arquivo 3D. Até 5 arquivos.</span></div>
        <!-- Só no app: abre a câmera do celular. "capture" pede a câmera traseira. -->
        <div class="campo" data-so-app hidden>
          <label for="foto">Ou tire uma foto agora</label>
          <input id="foto" name="anexos" type="file" accept="image/*" capture="environment">
        </div>
      </div>

      <p class="erro-msg" id="erro" role="alert"></p>
      <div class="acoes"><a class="botao fantasma" href="/painel.html">Cancelar</a><button class="botao principal" id="enviar">Enviar pedido</button></div>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const eu = exigirLogin("cliente");

    // Monta as opções de categoria e material a partir destas listas
    const CATEGORIAS = [
      ["Arquitetura", "Maquetes, volumetrias, terrenos"],
      ["Engenharia", "Protótipos, suportes, gabaritos"],
      ["Design de produto", "Modelos de apresentação"],
      ["Peças de reposição", "Botões, engrenagens, encaixes"],
      ["Saúde e educação", "Modelos anatômicos e didáticos"],
      ["Arte e cosplay", "Miniaturas, adereços, figuras"],
    ];
    // Dica curta de cada material, para quem não entende de impressão 3D
    const MATERIAIS = {
      "Não sei": "O fabricante sugere o melhor.",
      "PLA": "Rígido e barato. Bom para maquetes.",
      "PETG": "Resistente a impacto e calor.",
      "ABS": "Aguenta calor e pode ser lixado.",
      "Resina": "Detalhe muito fino.",
    };
    // Cores com uma bolinha de amostra
    const CORES = [["Tanto faz", ""], ["Branco", "#F4F4F2"], ["Cinza", "#8E959B"], ["Preto", "#222"],
                   ["Bege", "#D8C3A0"], ["Azul", "#2F5DA8"], ["Vermelho", "#C23B32"]];

    document.querySelector("#categorias").innerHTML = CATEGORIAS.map(([nome], i) =>
      `<label><input type="radio" name="categoria" value="${nome}" ${i === 0 ? "checked" : ""}>${nome}</label>`
    ).join("");
    document.querySelector("#materiais").innerHTML = Object.keys(MATERIAIS).map((m, i) =>
      `<label><input type="radio" name="material" value="${m === "Não sei" ? "Fabricante sugere" : m}" data-dica="${m}" ${i === 0 ? "checked" : ""}><span>${m}</span></label>`
    ).join("");
    document.querySelector("#cores").innerHTML = CORES.map(([nome, hex], i) =>
      `<label><input type="radio" name="cor" value="${nome}" ${i === 0 ? "checked" : ""}>${hex
        ? `<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${hex};border:1px solid rgba(0,0,0,.15);margin-right:6px;vertical-align:-1px"></span>` : ""}${nome}</label>`
    ).join("");

    // O prazo não pode ser uma data que já passou (o servidor também confere)
    const hoje = new Date();
    document.querySelector("#prazo").min = new Date(hoje - hoje.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

    const dica = document.querySelector("#dica-material");
    const mostrarDica = () => (dica.textContent = MATERIAIS[document.querySelector("input[name=material]:checked").dataset.dica]);
    document.querySelector("#materiais").onchange = mostrarDica;
    mostrarDica();

    // Envia o formulário com os arquivos (FormData monta tudo junto)
    document.querySelector("#form").onsubmit = async (e) => {
      e.preventDefault();
      const botao = document.querySelector("#enviar");
      const erro = document.querySelector("#erro");
      erro.textContent = "";
      botao.disabled = true;
      botao.textContent = "Enviando…";
      try {
        const pedido = await api("/pedidos", { method: "POST", body: new FormData(e.target) });
        location.href = "/pedido.html?id=" + pedido.id;
      } catch (err) {
        erro.textContent = err.message;
        botao.disabled = false;
        botao.textContent = "Enviar pedido";
      }
    };
  </script>
</body>
</html>
