<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrintHub 3D</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono&display=swap">
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <main class="pagina entrada">
    <div class="entrada-texto">
      <span class="rotulo">Impressão 3D sob encomenda</span>
      <h1>PrintHub 3D</h1>
      <p>Descreva a peça. Receba orçamentos de quem tem impressora.</p>
    </div>

    <section class="cartao entrada-cartao">
      <h2>Entrar</h2>

      <button class="botao-google" id="google" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        <span>Entrar com Google</span>
      </button>
      <p class="erro-msg" id="erro" role="alert"></p>

      <p class="nota">Fabricante? Entre com o e-mail que recebeu o convite.</p>

      <!-- Login antigo por e-mail: só para as contas de teste da demonstração -->
      <details class="login-teste">
        <summary>Entrar com conta de teste</summary>
        <form id="form-teste">
          <div class="campo"><label for="t-email">E-mail</label><input id="t-email" type="email" required autocomplete="email"></div>
          <div class="campo"><label for="t-senha">Senha</label><input id="t-senha" type="password" required autocomplete="current-password"></div>
          <button class="botao principal">Entrar</button>
        </form>
      </details>
    </section>
  </main>

  <!-- Biblioteca do Supabase (só para o login com Google) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/entrar.js"></script>
</body>
</html>
