<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus pedidos · PrintHub 3D</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono&display=swap">
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <header class="topo"><div class="topo-dentro">
    <a class="marca" href="/painel-cliente.html">PrintHub 3D</a>
    <nav class="perfil">
      <img id="foto-usuario" class="foto" alt="" hidden referrerpolicy="no-referrer">
      <span><span id="nome-usuario"></span> <span class="papel" id="papel-usuario"></span></span>
      <button class="botao pequeno" id="sair">Sair</button>
    </nav>
  </div></header>

  <main class="pagina">
    <div class="cabecalho-painel">
      <h1>Meus pedidos</h1>
      <a class="botao principal" href="/novo-pedido.html">+ Novo pedido</a>
    </div>

    <!-- Os pedidos aparecem agrupados pelo que o cliente precisa fazer -->
    <div id="grupos"><p class="vazio">Carregando…</p></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const eu = exigirLogin("cliente");

    // Grupos na ordem de prioridade para o cliente
    const GRUPOS = [
      { titulo: "Pronto: confirme quando receber", status: ["pronto"] },
      { titulo: "Escolha um orçamento", status: ["com_orcamento"] },
      { titulo: "Aguardando orçamentos", status: ["aberto"] },
      { titulo: "Em andamento", status: ["aceito", "em_producao"] },
      { titulo: "Entregues", status: ["entregue"] },
    ];

    async function carregar() {
      try {
        const pedidos = await api("/pedidos");

        if (!pedidos.length) {
          document.querySelector("#grupos").innerHTML =
            `<p class="vazio">Nenhum pedido ainda.<br>Toque em <b>+ Novo pedido</b> para começar.</p>`;
          return;
        }

        // Em qual grupo cada pedido entra. Se for um status que esta tela não conhece
        // (ex.: um status novo criado depois), vai para "Em andamento" em vez de sumir.
        const andamento = GRUPOS.find((g) => g.titulo === "Em andamento");
        const grupoDe = (p) => GRUPOS.find((g) => g.status.includes(p.status)) || andamento;

        document.querySelector("#grupos").innerHTML = GRUPOS.map((g) => {
          const lista = pedidos.filter((p) => grupoDe(p) === g);
          if (!lista.length) return "";
          return `<section class="grupo"><h2>${g.titulo} <span class="num">${lista.length}</span></h2>
            <ul class="lista">${lista.map((p) => {
              const n = p.orcamentos?.[0]?.count ?? 0;
              return itemPedido(p, n ? `${n} orçamento${n > 1 ? "s" : ""}` : "");
            }).join("")}</ul></section>`;
        }).join("");
      } catch (e) {
        document.querySelector("#grupos").innerHTML = `<p class="vazio">${esc(e.message)}</p>`;
      }
    }
    if (eu) {
      carregar();
      atualizarSozinho(carregar, 3); // orçamentos novos aparecem sem recarregar a página
    }
  </script>
</body>
</html>
