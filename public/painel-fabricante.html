<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oficina · PrintHub 3D</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono&display=swap">
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="tema-oficina">
  <header class="topo"><div class="topo-dentro">
    <a class="marca" href="/painel-fabricante.html">PrintHub 3D <span class="marca-sub">Oficina</span></a>
    <nav class="perfil">
      <img id="foto-usuario" class="foto" alt="" hidden referrerpolicy="no-referrer">
      <span><span id="nome-usuario"></span> <span class="papel" id="papel-usuario"></span></span>
      <button class="botao pequeno" id="sair">Sair</button>
    </nav>
  </div></header>

  <main class="pagina">
    <div class="cabecalho-painel">
      <h1>Oficina</h1>
    </div>

    <!-- Aviso para preencher a cidade (o Google não informa) -->
    <form class="cartao aviso-cidade" id="form-cidade" hidden>
      <h3>Onde fica sua oficina?</h3>
      <div class="chat-form"><input id="cidade" placeholder="Ex.: Campinas, SP" aria-label="Cidade" required><button class="botao principal">Salvar</button></div>
    </form>

    <div class="abas" role="tablist">
      <button role="tab" data-aba="aba-disponiveis" aria-selected="true">Novos <span class="contador" id="n-disponiveis"></span></button>
      <button role="tab" data-aba="aba-orcados" aria-selected="false">Orçados <span class="contador" id="n-orcados"></span></button>
      <button role="tab" data-aba="aba-trabalhos" aria-selected="false">Trabalhos <span class="contador" id="n-trabalhos"></span></button>
      <button role="tab" data-aba="aba-todos" aria-selected="false" id="btn-todos" hidden>Todos <span class="contador" id="n-todos"></span></button>
      <button role="tab" data-aba="aba-equipe" aria-selected="false" id="btn-equipe" hidden>Equipe</button>
    </div>

    <section class="aba" id="aba-disponiveis"><ul class="lista" id="lista-disponiveis"><li class="vazio">Carregando…</li></ul></section>
    <section class="aba" id="aba-orcados" hidden><ul class="lista" id="lista-orcados"></ul></section>
    <section class="aba" id="aba-trabalhos" hidden><ul class="lista" id="lista-trabalhos"></ul></section>
    <!-- Só o DONO vê esta aba: todos os pedidos da plataforma, em qualquer etapa -->
    <section class="aba" id="aba-todos" hidden><ul class="lista" id="lista-todos"></ul></section>

    <!-- Só o DONO vê esta aba: convida outros fabricantes -->
    <section class="aba" id="aba-equipe" hidden>
      <div class="duas-colunas">
        <form class="cartao" id="form-convite">
          <div><h2>Convidar</h2>
            <p class="apagado">A pessoa entra com este e-mail Google e já vira fabricante.</p></div>
          <div class="chat-form"><input id="convite-email" type="email" placeholder="nome@gmail.com" aria-label="E-mail do convidado" required><button class="botao principal">Convidar</button></div>
          <p class="erro-msg" id="convite-erro" role="alert"></p>
          <div><h3>Convites</h3><ul class="lista-simples" id="lista-convites"></ul></div>
        </form>
        <section class="cartao"><h2>Equipe</h2>
          <p class="erro-msg" id="equipe-erro" role="alert"></p>
          <ul class="lista-simples" id="lista-fabricantes"></ul></section>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/painel-fabricante.js"></script>
</body>
</html>
